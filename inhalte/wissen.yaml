- id: pump-and-dump
  saeule: Scams and traps
  titel: How a pump-and-dump works
  gross: 3 phases
  gross_text: accumulate, promote, sell
  fakten: {phasen: 3}
  punkte:
    - "Accumulate: a group quietly buys a small coin while it's cheap."
    - "Promote: groups and posts build pressure: new partnership, last chance, it's about to explode."
    - "Sell: when new buyers arrive, the group sells to them. Price collapses and the last ones in take the loss."
  x: "Pump-and-dump in 3 phases:\n1. quietly accumulate\n2. loudly promote\n3. sell to the new buyers\nIf someone is rushing you, ask: who is selling to me right now?\nNot financial advice."

- id: fake-guru
  saeule: Scams and traps
  titel: 5 signs of a fake crypto guru
  gross: 5 signs
  gross_text: that give away a shady guru
  fakten: {zeichen: 5}
  punkte:
    - They only show wins, never losses. They promise fixed returns or call anything "safe".
    - They rush you ("today only") and sell expensive groups or courses.
    - They recommend coins without disclosing that they hold them.
  x: "5 signs of a fake crypto guru:\n1. never shows losses\n2. promises fixed returns\n3. rushes you\n4. sells expensive groups\n5. hides their own positions\nNot financial advice."
