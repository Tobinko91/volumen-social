- id: risiko-1-prozent
  saeule: Learn trading
  titel: Why risking 1% per trade protects your account
  gross: "90.4%"
  gross_text: left after 10 losses in a row
  fakten: {risiko_klein: 1, risiko_gross: 5, verluste: 10, rest_1: 90.4, rest_5: 59.9}
  punkte:
    - Risk 1% per trade and after 10 losses in a row you still have 90.4% of your account.
    - Risk 5% per trade and you are down to 59.9%.
    - Losing streaks happen to good strategies too. Your position size decides whether you survive them.
  x: "10 losses in a row.\nRisking 1% per trade: 90.4% of your account is left.\nRisking 5%: only 59.9%.\nPosition size matters more than the perfect trade.\nNot financial advice."

- id: verlust-falle
  saeule: Learn trading
  titel: "The loss trap: why −50% needs +100%"
  gross: "+100%"
  gross_text: needed to recover from a 50% loss
  fakten: {v20: 20, g20: 25, v50: 50, g50: 100, v90: 90, g90: 900}
  punkte:
    - After a 20% loss you need a 25% gain to get back to even.
    - After a 50% loss you need 100%.
    - After a 90% loss you need 900%. Avoiding big losses matters more than chasing big wins.
  x: "Losses and recoveries are not the same size:\n−20% needs +25%\n−50% needs +100%\n−90% needs +900%\nRule one: avoid big losses.\nNot financial advice."

- id: hebel
  saeule: Learn trading
  titel: What leverage really means
  gross: "10%"
  gross_text: move against you wipes out a 10x position
  fakten: {hebel_10: 10, bewegung_10: 10, hebel_20: 20, bewegung_20: 5}
  punkte:
    - With 10x leverage a 10% move against you wipes out your stake (simplified, before fees).
    - With 20x leverage 5% is enough.
    - Small caps move 10% in a day all the time. Leverage doesn't just magnify wins, it magnifies mistakes.
  x: "Leverage in one line:\n10x: a 10% move against you = stake gone\n20x: just 5%\nSmall caps move 10% in a day all the time.\nNot financial advice."

- id: unterstuetzung
  saeule: Understanding buy zones
  titel: Support and resistance, simply explained
  gross: Support
  gross_text: an area where buyers often stepped in before
  fakten: {}
  punkte:
    - "Support: a price area where buyers repeatedly stepped in and the price turned."
    - "Resistance: an area where sellers repeatedly stepped in. The more often an area held and the more volume traded there, the more traders watch it."
    - When support breaks clearly, it often turns into resistance. No level is a guarantee.
  x: "Why price often turns at the same levels:\nSupport = buyers stepped in there before.\nResistance = sellers stepped in there before.\nWhen support breaks, it often becomes resistance.\nNot financial advice."

- id: liquiditaetszone
  saeule: Understanding buy zones
  titel: "Liquidity zones: where the orders are waiting"
  gross: Liquidity
  gross_text: builds up where many orders sit
  fakten: {}
  punkte:
    - Many traders put their stops just below obvious lows or just above obvious highs.
    - That's where orders pile up, which means liquidity. Large players need exactly that liquidity to move size.
    - That's why price often dips just below a low and then turns. Knowing this, you can place your stop less obviously.
  x: "Why price often dips below the low and then reverses:\nThat's where the stops are = lots of liquidity.\nBig players need exactly those orders.\nObvious stops tend to get taken first.\nNot financial advice."

