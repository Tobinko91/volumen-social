# S13 Termine der Woche (montags): wichtige US-Termine, die Krypto bewegen.
# Zeiten in New-Yorker Ortszeit (ET); UTC rechnet social/termine.py selbst aus (Sommer-/Winterzeit).
# Quellen (nur zur Pflege, nie im Beitrag): BLS-Kalender (CPI, Arbeitsmarkt), BEA-Kalender (PCE),
# Federal Reserve (FOMC). Stand 01.11.2026. Laeuft die Liste aus, meldet der Redaktions-Bot das 4 Wochen vorher.
# zeit leer = ganztaegig (z. B. Wahl).
# Der monatliche Optionsverfall auf Deribit (letzter Freitag, 08:00 UTC) wird berechnet, steht nicht hier.
arten:
  cpi:
    en: {titel: "US CPI inflation", info: "Consumer prices for {monat}. Hotter than expected often hits risk assets."}
    de: {titel: "US-Inflation (CPI)", info: "Verbraucherpreise für {monat}. Höher als erwartet belastet oft Risiko-Anlagen."}
  nfp:
    en: {titel: "US jobs report", info: "Payrolls and unemployment for {monat}. Shapes rate-cut bets."}
    de: {titel: "US-Arbeitsmarktbericht", info: "Stellen und Arbeitslosigkeit für {monat}. Prägt die Zinserwartungen."}
  pce:
    en: {titel: "US PCE inflation", info: "The Fed's preferred inflation gauge, data for {monat}."}
    de: {titel: "US-Inflation (PCE)", info: "Das Inflationsmaß der Fed, Daten für {monat}."}
  fomc:
    en: {titel: "Fed rate decision", info: "FOMC statement, press conference 30 minutes later."}
    de: {titel: "Fed-Zinsentscheid", info: "FOMC-Beschluss, Pressekonferenz 30 Minuten später."}
  protokoll:
    en: {titel: "Fed minutes", info: "Minutes of the last FOMC meeting."}
    de: {titel: "Fed-Protokoll", info: "Protokoll der letzten FOMC-Sitzung."}
  wahl:
    en: {titel: "US midterm elections", info: "Control of Congress at stake. Markets react to the results."}
    de: {titel: "US-Zwischenwahlen", info: "Es geht um den Kongress. Märkte reagieren auf das Ergebnis."}
  ism:
    en: {titel: "ISM manufacturing", info: "First big US data of the month, factory activity in {monat}."}
    de: {titel: "ISM Industrie", info: "Erste große US-Daten im Monat, Industrie im {monat}."}
  ism_dienst:
    en: {titel: "ISM services", info: "Services activity in {monat}, the larger part of the US economy."}
    de: {titel: "ISM Dienstleistungen", info: "Dienstleister im {monat}, der größere Teil der US-Wirtschaft."}
  verfall:
    en: {titel: "Deribit options expiry", info: "Monthly BTC and ETH options expire. Volatility often rises around it."}
    de: {titel: "Optionsverfall Deribit", info: "Monatliche BTC- und ETH-Optionen verfallen. Oft mehr Schwankung."}

