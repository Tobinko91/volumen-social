# WhaleSqueeze Redaktion – Einstellungen
# Schluessel (Claude-API, ElevenLabs, Telegram, Kanaele) stehen NUR auf dem Server in secrets.yaml.

daten:
  # Ordner, in den der Bot alle 5 Minuten schreibt (nur lesen!)
  dir: /opt/volumen-bot/web
  max_alter_min: 30          # aeltere Daten -> kein Video, Warnung

website:
  oeffentlich: false         # erst auf true, wenn whalesqueeze.com ohne Passwort erreichbar ist (oeffentlicher Start).
                             # Bis dahin keine Website-Links in Posts (fuehrten auf die Passwort-Abfrage, 01.11.2026)

autopost:                    # Freigabe-Tor (Entscheidung Tobias 01.11.2026), Details in social/autopost.py
  aktiv: true
  formate: [markt, markt_video, coincheck, wissen, wal, wal_video]   # nie: news, Eilmeldungen, Redaktions-Beitraege
  saubere_tage: 14           # so lange muss ein Format ohne Verwerfen laufen
  min_freigaben: 10          # und so oft von Tobias freigegeben sein

kommentare:                  # Kommentar-Assistent (Punkt D): 15:30 + 20:30 Vorschlaege an Tobias, er postet selbst
  aktiv: true
  anzahl: 8                  # Vorschlaege je Lauf, 2 Laeufe = 16 (Regel: hoechstens ca. 20 Kommentare am Tag; 06.11.: 5 -> 8)
  eigenes_konto: whalesqueeze   # fuer die Kommentar-Bilanz (eigene Antworten auf X, sonntags 18:30)
  stunden: 3                 # nur Posts der letzten 3 Std. (Kommentare in der ersten Stunde werden am meisten gesehen)
  max_posts: 30              # gelesene Posts je X-Suche (ca. 0,005 $ je Post)
  konten: [KobeissiLetter, WatcherGuru, whale_alert, lookonchain, arkham, intocryptoverse, alicharts,
           rektcapital, CryptoMichNL, spotonchain, glassnode, cryptoquant_com, CoinBureau, tier10k,
           WuBlockchain, santimentfeed, AltcoinDaily, BitcoinMagazine, unusual_whales, DeItaone]   # 06.11.: +6 fuer 8 je Lauf

folgen:                      # Folge-Liste (tools/folgen.py, 16:30 an Tobias; Wunsch 31.10.2026)
  x_pro_tag: 10              # X per Knopf (ca. 0,025 $ je Konto); X verbietet nur massenhaftes Folgen
  andere_pro_tag: 5          # (alt) Instagram/TikTok/YouTube zusammen, wenn je_plattform fehlt
  je_plattform: {instagram: 5, tiktok: 5, youtube: 2}   # Konten zum Folgen/Kommentieren (06.11.: weniger, dafuer ohne Wiederholung)
  sperr_tage: 7              # 06.11.2026 Tobias: kein Konto/Link vor Ablauf von 7 Tagen erneut zeigen
  youtube_videos: 10         # frische Videos der letzten 24 Std. aus der YouTube-Suche, nie doppelt
  suchbegriffe: [bitcoin news, crypto news, altcoins, bitcoin price, crypto trading, ethereum news,
                 crypto whales, solana news, bitcoin today, crypto market]
  kommentare: true           # je Instagram/TikTok/YouTube-Konto ein Kommentar zum Einkopieren (eigene Zahlen)

eil:                         # Live-Eilmeldungen (tools/live.sh, alle 10 Min. rund um die Uhr, Wunsch Tobias 30.10.)
  max_pro_tag: 5             # hoechstens so viele Eilmeldungs-Vorschlaege in 24 Std.

radar:                       # S18 News-Radar (inhalte/quellen.yaml, radar: true)
  x_lesen: false             # X-Konten (Kobeissi, Walter Bloomberg ...) mitlesen; kostet je Abruf -> erst an, wenn Guthaben da
  x_max_posts: 30            # hoechstens so viele Posts je Abruf (nur in den News-Slots 14/19/21 Uhr, nie stuendlich)

sprache: en                  # seit 26.10.2026 nur Englisch (Entscheidung Tobias); vorher Deutsch

video:
  breite: 1080
  hoehe: 1920
  fps: 30
  musik: /opt/volumen-social/musik   # 02.11.2026 Tobias: erzeugte Musik gefaellt nicht. Ordner mit lizenzfreien Stuecken
                             # (taeglich ein anderes); leer = ohne Musik. Alternativ "generiert" oder eine Datei
  untertitel_animiert: true   # Wort fuer Wort im Video (04.11.2026); false = fester Satz-Kasten im Bild
  haken_test: true            # A/B: Tage abwechselnd Frage / Zahl als Einstieg (04.11.2026), Wochenbericht vergleicht
  untertitel_y: 1460          # Oberkante Untertitel-Kasten: Reels aus dem Chat und „🎬 Als Reel“ (05.11.: ganzer Satz)
  untertitel_y_formate: 1230  # Markt, Wal, Lernen, Willkommen (Platz des frueheren Satz-Kastens)
  musik_db: -22              # Lautstaerke unter einer Stimme
  musik_db_ohne_stimme: -3   # Videos ohne Stimme: Musik traegt, Untertitel erzaehlen
  woerter_pro_sekunde: 2.6   # nur fuer die Probe ohne Stimme
  min_szene_s: 2.5

farben:                      # dunkle Website-Farben (stil.css)
  grund: "#0C1E27"
  flaeche: "#12293A"
  text: "#E2ECEC"
  neben: "#93AAB3"
  linie: "#24414F"
  amber: "#F2B33D"
  plus: "#4CC79C"
  minus: "#F07884"

text:
  modell: claude-sonnet-5-5
  max_woerter: 85            # ca. 30 Sekunden
  max_woerter_wissen: 50     # Lern-Reels ca. 15-18 Sekunden (08.11.2026: Haltequote 8 % bei 30-Sek.-Reels)
  max_woerter_warum: 150     # „Why did it move?“ ca. 50 Sekunden (Kurs, Futures, Volumen, Halter, Urteil)

stimme:   # Sobald die Stimme laeuft: Tobias an S30 erinnern (Willkommensvideo bauen und anpinnen, ideen-backlog)
  aktiv: true                # 01.11.2026 Tobias: Stimme rein. Ohne Schluessel des Anbieters bleibt es still
  anbieter: elevenlabs       # 03.11.2026 11:45 Tobias: ElevenLabs (OpenAI lehnte die Karte ab). Weitere: openai, google
  openai_modell: gpt-4o-mini-tts   # !! OpenAI schaltet es am 6.1.2027 ab, vorher umstellen (Erinnerung 01.12.)
  openai_stimme: cedar       # laut OpenAI beste Qualitaet: cedar (maennlich), marin (weiblich); Auswahl per Hoerprobe
  google_stimme: "en-US-Chirp3-HD-Charon"   # maennlich, ruhig; Alternative weiblich: en-US-Chirp3-HD-Kore
  tempo: null                # z. B. 1.08 = etwas schneller (Kurzvideos); null = normal
  voice_name: "Brian"             # englische Stimme (seit 26.10.2026); eigene Stimme spaeter z. B. "WhaleSqueeze EN"; ID wird per Name gesucht
  voice_id: null                  # optional: feste ID statt Name
  modell: eleven_flash_v2_5  # halbe Zeichen-Kosten (0,5 Credits je Zeichen): ~25.000/Monat passt in Starter (30.000)

instagram:
  story: true               # jeden Instagram-Beitrag auch als Story teilen (Punkt C, 01.11.2026)

zeitplan:                    # S31 (Tobias 02.11.2026): einmal freigeben, jeder Kanal zu seiner Zeit
  aktiv: true
  fenster:                   # Beginn in deutscher Zeit (US-Winterzeit: ET + 6 Std.), Ende 23:59; Telegram/X immer sofort
    instagram: "18:00"       # 12:00 ET
    tiktok: "19:00"          # 13:00 ET
    youtube: "20:00"         # 14:00 ET
  sofort_formate: [news, redaktion, redaktion_video]   # News, Eilmeldungen, Beitraege aus dem Redaktions-Chat: ueberall sofort
  nur_video: [tiktok]        # bei „Alle Kanäle“: TikTok nur Videos und Bilderserien (einzelner Knopf geht immer)

youtube:
  in_alle: false            # 02.11.2026 Tobias: YouTube nicht bei „Alle Kanäle“, nur per ▶️-Knopf; true nach der Google-Pruefung
  sichtbarkeit: private      # bis Google die App geprueft hat (Audit), dann public

tiktok:
  modus: inbox               # inbox = Entwurf in der TikTok-App (geht ohne Pruefung); direkt = sofort posten (nach Pruefung)

hinweise:                    # fusszeile/konflikt: Bilder und Videos
  post_text: "Not financial advice."   # unter allen Texten (Wunsch Tobias 22.10.2026: nur dieser Satz; Englisch seit 26.10.)
  fusszeile: "Not financial advice"    # in Bildern und Videos
  konflikt: ""                         # entfernt (Wunsch Tobias 22.10.2026)

pruefung:
  # Woerter/Wendungen, die nie in einem Video vorkommen duerfen (Kleinschreibung)
  verboten:
    # Deutsch
    - "jetzt kaufen"
    - "kauf jetzt"
    - "jetzt verkaufen"
    - "nachkaufen"
    - "garantiert"
    - "sicherer gewinn"
    - "ohne risiko"
    - "risikofrei"
    - "kann nicht verlieren"
    - "zum mond"
    - "anlageberatung"      # nur in der festen Fusszeile, nie im Sprechtext
    - "einstieg"
    - "kaufzone"            # nur in Bildungs-Formaten mit historischen Beispielen (eigene Pruefung)
    - "kursziel"
    - "berichten zufolge"   # Fakten direkt nennen (Wunsch Tobias 26.10.2026)
    - "angeblich"
    - "take profit"
    - "stop-loss bei"
    - "du solltest"
    - "noch nicht zu spät"
    - "verpass nicht"
    - "reich werden"
    # Englisch
    - "buy now"
    - "buy the dip"
    - "sell now"
    - "guaranteed"
    - "can't lose"
    - "risk-free"
    - "risk free"
    - "to the moon"
    - "100x"
    - "1000x"
    - "financial advice"   # nur in der festen Fusszeile, nie im Sprechtext
    - "entry"
    - "take profit"
    - "stop loss"
    - "price target"
    - "you should"
    - "not too late"
  zahlen_toleranz: 0.06      # Zahl im Text darf max. 0,06 von einer Datenzahl abweichen (Rundung)

warum:
  aktiv: true    # 05.11.2026 Tobias: wieder an (14:30 Gewinner, 18:30 Verlierer). Pause: false

liquiditaet:                 # S24 (Wunsch Tobias 06.11.2026): Zonen in Top/Flop-Bildern + Eilmeldungen
  aktiv: true                # taeglich 17:00 (Mo-Sa) Top- und Flop-Coin mit geschaetzten Zonen + Heatmap
  eil_aktiv: true            # Eilmeldungen aus liquiditaet.json -> eilmeldungen[] (alle 10 Min., Ruhezeit 22-7)
  eil_max_tag: 4             # mehr nur, wenn Tobias es so will

unlocks:                     # S22 Unlock-Posts + S26 Nachfolge-Reels (Wunsch Tobias 03./06.11.2026), alle 10 Min.
  aktiv: true
  schon_gepostet: [ALLO]     # aus dem Redaktions-Chat gepostet (S25, 06.11.) -> Nachfolge-Reels 12.11./18.11.

# S29 „The textbook is WRONG“ (Wunsch Tobias 10.11.2026): donnerstags 21:30 statt S27, 1 Folge pro Woche.
# Daten: muster_des_tages.json -> lehrbuch_falsch[] (Bot 9.38). Danach Abschluss Hammer (braucht dessen Statistik).
lehrbuch:
  aktiv: true
  reihe: [double_top, range_breakdown, double_bottom, three_white_soldiers]
