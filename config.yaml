# WhaleSqueeze Redaktion – Einstellungen
# Schluessel (Claude-API, ElevenLabs, Telegram, Kanaele) stehen NUR auf dem Server in secrets.yaml.

daten:
  # Ordner, in den der Bot alle 5 Minuten schreibt (nur lesen!)
  dir: /opt/volumen-bot/web
  max_alter_min: 30          # aeltere Daten -> kein Video, Warnung

sprache: de                  # Start auf Deutsch (entschieden 20.10.2026), Englisch spaeter als eigene Kanaele

video:
  breite: 1080
  hoehe: 1920
  fps: 30
  musik: null                # Pfad zu lizenzfreier Musik (mp3), null = ohne
  musik_db: -22
  woerter_pro_sekunde: 2.6   # nur fuer die Probe ohne Stimme
  min_szene_s: 2.5

farben:                      # dunkle Website-Farben (stil.css)
  grund: "#0C1E27"
  flaeche: "#12293A"
  text: "#E2ECEC"
  neben: "#93AAB3"
  linie: "#24414F"
  amber: "#F2B33D"
  plus: "#4CC79C"
  minus: "#F07884"

text:
  modell: claude-sonnet-5-5
  max_woerter: 85            # ca. 30 Sekunden

stimme:
  anbieter: elevenlabs
  voice_name: "WhaleSqueeze DE"   # eigene Stimme aus Voice Design (20.10.2026); ID wird per Name gesucht
  voice_id: null                  # optional: feste ID statt Name
  modell: eleven_multilingual_v2

hinweise:                    # fusszeile/konflikt: Bilder und Videos
  post_text: "Keine Anlageberatung."   # unter Telegram-Texten (Wunsch Tobias 22.10.2026: nur dieser Satz)
  fusszeile: "Keine Anlageberatung"   # in Bildern und Videos (Wunsch Tobias 22.10.2026: nur das)
  konflikt: ""                         # entfernt (Wunsch Tobias 22.10.2026)

pruefung:
  # Woerter/Wendungen, die nie in einem Video vorkommen duerfen (Kleinschreibung)
  verboten:
    # Deutsch
    - "jetzt kaufen"
    - "kauf jetzt"
    - "jetzt verkaufen"
    - "nachkaufen"
    - "garantiert"
    - "sicherer gewinn"
    - "ohne risiko"
    - "risikofrei"
    - "kann nicht verlieren"
    - "zum mond"
    - "anlageberatung"      # nur in der festen Fusszeile, nie im Sprechtext
    - "einstieg"
    - "kaufzone"            # nur in Bildungs-Formaten mit historischen Beispielen (eigene Pruefung)
    - "kursziel"
    - "take profit"
    - "stop-loss bei"
    - "du solltest"
    - "noch nicht zu spät"
    - "verpass nicht"
    - "reich werden"
    # Englisch
    - "buy now"
    - "buy the dip"
    - "sell now"
    - "guaranteed"
    - "can't lose"
    - "risk-free"
    - "risk free"
    - "to the moon"
    - "100x"
    - "1000x"
    - "financial advice"   # nur in der festen Fusszeile, nie im Sprechtext
    - "entry"
    - "take profit"
    - "stop loss"
    - "price target"
    - "you should"
    - "not too late"
  zahlen_toleranz: 0.06      # Zahl im Text darf max. 0,06 von einer Datenzahl abweichen (Rundung)
